<!doctype html>
<html lang="zh-CN" data-biliscript-onboarding="1" data-palette="flyme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script src="./theme-init.js"></script>
    <title>BiliScript｜域名访问授权</title>
    <link rel="icon" type="image/png" href="../icons/icon32.png" />
    <link rel="stylesheet" href="./styles/tokens-primitive.css" />
    <link rel="stylesheet" href="./styles/reader-gate.css" />
    <link rel="stylesheet" href="./styles/permission-grant.css" />
  </head>
  <body class="grant-page">
    <div class="grant-backdrop" aria-hidden="true"></div>
    <main class="grant-shell" aria-labelledby="permissionGrantTitle">
      <header class="grant-brand">
        <svg class="grant-logo" viewBox="0 0 128 128" width="24" height="24" aria-hidden="true">
          <defs>
            <linearGradient id="bsGrantLogoBg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FB7299" />
              <stop offset="1" stop-color="#F0508A" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#bsGrantLogoBg)" />
          <path fill="#fff" transform="translate(30,72) scale(0.76)" d="M23.10-48.05Q23.10-44.92 20.58-42.58Q18.07-40.23 14.65-40.23Q9.28-40.23 6.40-43.80Q3.52-47.36 3.52-53.66Q3.52-59.52 8.47-65.48Q13.43-71.44 20.41-74.51L22.56-71.04Q17.04-68.36 13.92-64.79Q10.79-61.23 10.30-56.15L13.04-56.15Q16.06-56.15 17.97-55.47Q19.87-54.79 21.04-53.56Q22.17-52.39 22.63-50.98Q23.10-49.56 23.10-48.05M47.17-48.05Q47.17-44.92 44.65-42.58Q42.14-40.23 38.72-40.23Q33.35-40.23 30.47-43.80Q27.59-47.36 27.59-53.66Q27.59-59.52 32.54-65.48Q37.50-71.44 44.48-74.51L46.63-71.04Q41.11-68.36 37.99-64.79Q34.86-61.23 34.38-56.15L37.11-56.15Q40.14-56.15 42.04-55.47Q43.95-54.79 45.12-53.56Q46.24-52.39 46.70-50.98Q47.17-49.56 47.17-48.05Z" />
          <rect x="34" y="84" width="60" height="9" rx="4.5" fill="#fff" />
          <rect x="34" y="100" width="38" height="9" rx="4.5" fill="#fff" opacity=".55" />
        </svg>
        <span class="grant-brand-title">BiliScript｜B站视频文摘</span>
      </header>
      <h1 id="permissionGrantTitle" class="grant-title">允许访问以下域名</h1>
      <p class="grant-reason">受浏览器安全限制，自定义或本地域名需在扩展窗口内触发授权。点击「允许访问」后，请在浏览器弹出的提示中确认。</p>
      <ul id="permissionGrantOrigins" class="grant-origins"></ul>
      <p id="permissionGrantStatus" class="grant-status" role="status" aria-live="polite" hidden></p>
      <div class="grant-actions">
        <button id="permissionGrantCancelBtn" type="button" class="grant-btn grant-btn-secondary">取消</button>
        <button id="permissionGrantAllowBtn" type="button" class="grant-btn grant-btn-primary">允许访问</button>
      </div>
    </main>
    <script type="module" src="./permission-grant.js"></script>
  </body>
</html>
